<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CineMatch Recommender</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { margin-bottom: 20px; }
  form {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 24px;
  }
  label { font-weight: bold; display: block; margin-bottom: 4px; }
  input, select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
  button {
    padding: 9px 20px; border: none; border-radius: 4px;
    background: #2b6cb0; color: white; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #245a94; }
  .movie-card {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px;
    margin-bottom: 12px; background: #fafafa;
  }
  .movie-card h3 { margin: 0 0 8px 0; }
  .genre-tag {
    font-size: 12px; background: #e2e8f0; padding: 2px 8px;
    border-radius: 12px; margin-right: 6px; display: inline-block;
  }
  .rating { font-size: 13px; color: #4a5568; margin-top: 6px; }
  .error { color: #c0392b; }
  .status { color: #555; }
</style>
</head>
<body>

<h1>🎬 CineMatch Recommender</h1>

<form id="rec-form">
  <div>
    <label for="name-input">Name</label>
    <input id="name-input" type="text" placeholder="Your name" required>
  </div>
  <div>
    <label for="age-input">Age</label>
    <input id="age-input" type="number" min="1" max="120" placeholder="Age" style="width:80px" required>
  </div>
  <div>
    <label>Recommend by</label>
    <div style="display:flex; gap:12px; padding-top:6px;">
      <label style="font-weight:normal;">
        <input type="radio" name="mode" value="genre" checked> Genre
      </label>
      <label style="font-weight:normal;">
        <input type="radio" name="mode" value="movie"> Favorite Movie
      </label>
    </div>
  </div>

  <div id="genre-field">
    <label for="genre-select">Favorite Genre</label>
    <select id="genre-select">
      <option value="">Loading genres...</option>
    </select>
  </div>

  <div id="movie-field" style="display:none;">
    <label for="movie-input">Favorite Movie</label>
    <input id="movie-input" type="text" placeholder="e.g. Toy Story" list="movie-suggestions" style="width:220px">
    <datalist id="movie-suggestions"></datalist>
  </div>

  <button type="submit">Get Recommendations</button>
</form>

<div id="status"></div>
<div id="results"></div>

<script>
  const API_BASE = 'http://localhost:8000';

  const genreSelect = document.getElementById('genre-select');
  const movieInput = document.getElementById('movie-input');
  const movieSuggestions = document.getElementById('movie-suggestions');
  const genreField = document.getElementById('genre-field');
  const movieField = document.getElementById('movie-field');
  const form = document.getElementById('rec-form');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  // Toggle which input is shown based on the selected mode
  document.querySelectorAll('input[name="mode"]').forEach((radio) => {
    radio.addEventListener('change', (e) => {
      const isGenre = e.target.value === 'genre';
      genreField.style.display = isGenre ? '' : 'none';
      movieField.style.display = isGenre ? 'none' : '';
    });
  });

  // Load genres for the dropdown
  fetch(`${API_BASE}/genres`)
    .then(res => res.json())
    .then(genres => {
      genreSelect.innerHTML = genres.map(g => `<option value="${g}">${g}</option>`).join('');
    })
    .catch(() => {
      const fallback = ['Comedy', 'Drama', 'Action', 'Sci-Fi', 'Romance'];
      genreSelect.innerHTML = fallback.map(g => `<option value="${g}">${g}</option>`).join('');
      statusEl.innerHTML = `<p class="error">Could not reach backend to load genres — showing a default list. Is uvicorn running?</p>`;
    });

  // As the user types a movie title, fetch matching suggestions
  let movieSearchTimeout;
  movieInput.addEventListener('input', () => {
    clearTimeout(movieSearchTimeout);
    const query = movieInput.value.trim();
    if (!query) { movieSuggestions.innerHTML = ''; return; }
    movieSearchTimeout = setTimeout(() => {
      fetch(`${API_BASE}/movies/search?query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(movies => {
          movieSuggestions.innerHTML = movies.map(m => `<option value="${m.title}">`).join('');
        })
        .catch(() => {});
    }, 250);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name-input').value.trim();
    const age = Number(document.getElementById('age-input').value);
    const mode = document.querySelector('input[name="mode"]:checked').value;

    const payload = { name, age };
    if (mode === 'genre') {
      payload.favorite_genre = genreSelect.value;
    } else {
      payload.favorite_movie = movieInput.value.trim();
    }

    resultsEl.innerHTML = '';
    statusEl.innerHTML = '<p class="status">Computing recommendations...</p>';

    try {
      const response = await fetch(`${API_BASE}/recommend`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('Backend returned an error.');
      const data = await response.json();
      statusEl.innerHTML = '';

      const movies = data.recommendations || [];
      if (movies.length === 0) {
        resultsEl.innerHTML = '<p>No recommendations found — try a different genre.</p>';
        return;
      }

      resultsEl.innerHTML = movies.map(m => `
        <div class="movie-card">
          <h3>${m.title}</h3>
          <div>${(m.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
          <div class="rating">
            ⭐ ${m.avg_rating != null ? m.avg_rating.toFixed(1) : 'N/A'} average
            ${m.num_ratings != null ? `(${m.num_ratings} ratings)` : ''}
          </div>
        </div>
      `).join('');
    } catch (err) {
      statusEl.innerHTML = `<p class="error">${err.message}</p>`;
    }
  });
</script>

</body>
</html>
